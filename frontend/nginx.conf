server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the SPA loads is same-origin except the map tiles and the
    # webfonts, which are named explicitly rather than opened up wholesale.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # Shared caches must not hand a gzipped body to a client that cannot read it.
    gzip_vary on;

    # Hashed build assets are immutable; index.html must never be cached or
    # clients pin themselves to a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The simulator can idle between bursts; don't cut the socket for it.
        proxy_read_timeout 3600s;
    }

    # A student's live "under attack" feed. Exact match so it wins over the
    # /site/ prefix below and gets the upgrade headers.
    location = /site/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The vulnerable target site. Without this the SPA fallback below swallows
    # /site/register and /site/login and hands students the app shell instead
    # of the API — the whole classroom exercise runs through here.
    location /site/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths resolve to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
